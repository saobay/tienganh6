<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 3 - Đề 5: Ngữ Âm & Trọng Âm</title>
    <style>
        :root { --primary-color: #1e88e5; --secondary-color: #0d47a1; --correct-color: #2e7d32; --wrong-color: #c62828; --bg-card: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; background: #f4f6f9; color: #333; line-height: 1.6; }
        h2, h3 { color: var(--secondary-color); margin-top: 0; }
        .note-card { background: #e3f2fd; border-left: 5px solid var(--primary-color); padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 0.95rem; }
        .question-card { background: var(--bg-card); border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .question-card.status-correct { border-left: 6px solid var(--correct-color); background: #f1f8e9; }
        .question-card.status-wrong { border-left: 6px solid var(--wrong-color); background: #fbe9e7; }
        .btn-submit-q { background: var(--primary-color); color: white; border: none; padding: 7px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 8px; }
        .btn-audio { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; margin-left: 6px; }
        .btn-audio:hover { background: #bbdefb; }
        .explanation { display: none; margin-top: 10px; padding: 10px; border-radius: 5px; font-size: 0.93rem; }
        .explanation.correct { background: #e8f5e9; color: #1b5e20; }
        .explanation.wrong { background: #ffebee; color: #b71c1c; }
    </style>
</head>
<body>
    <h2>ĐỀ KIỂM TRA SỐ 5 - UNIT 3: CHUYÊN ĐỀ NGỮ ÂM & TRỌNG ÂM</h2>

    <div class="note-card">
        <b>💡 Mẹo nhỏ:</b> Bấm vào biểu tượng 🔊 bên cạnh từng đáp án để nghe phát âm giọng chuẩn trước hoặc sau khi làm bài!
    </div>

    <h3>PART 1: PRONUNCIATION (Phân biệt âm /p/ và /b/)</h3>
    <div id="part1Quiz"></div>

    <h3 style="margin-top: 30px;">PART 2: STRESS (Trọng âm tính từ chỉ tính cách)</h3>
    <div id="part2Quiz"></div>

    <script>
        const part1Data = [
            { id: 1, q: "Câu 1: Choose the word starting with /p/ sound.", opts: [{ text: "A. patient", word: "patient" }, { text: "B. birthday", word: "birthday" }, { text: "C. blonde", word: "blonde" }, { text: "D. body", word: "body" }], ans: "A", exp: "A (patient) bắt đầu bằng âm /p/. B, C, D bắt đầu bằng âm /b/.", q_tr: "Chọn từ bắt đầu bằng âm /p/.", ans_tr: "Đáp án A: patient (kiên nhẫn)." },
            { id: 2, q: "Câu 2: Choose the word starting with /b/ sound.", opts: [{ text: "A. pony", word: "pony" }, { text: "B. picture", word: "picture" }, { text: "C. picnic", word: "picnic" }, { text: "D. basketball", word: "basketball" }], ans: "D", exp: "D (basketball) bắt đầu bằng âm /b/. A, B, C bắt đầu bằng âm /p/.", q_tr: "Chọn từ bắt đầu bằng âm /b/.", ans_tr: "Đáp án D: basketball (bóng rổ)." },
            { id: 3, q: "Câu 3: Choose the word with a different vowel sound.", opts: [{ text: "A. kind", word: "kind" }, { text: "B. active", word: "active" }, { text: "C. clever", word: "clever" }, { text: "D. friendly", word: "friendly" }], ans: "A", exp: "A (kind) phát âm chữ 'i' là /aɪ/. B phát âm là /ɪ/.", q_tr: "Chọn từ có nguyên âm khác các từ còn lại.", ans_tr: "Đáp án A: kind (tốt bụng)." }
        ];

        const part2Data = [
            { id: 4, q: "Câu 4: Trọng âm tính từ 2 âm tiết", opts: [{ text: "A. clever", word: "clever" }, { text: "B. active", word: "active" }, { text: "C. friendly", word: "friendly" }, { text: "D. polite", word: "polite" }], ans: "D", exp: "D (polite) có trọng âm nhấn âm tiết 2 (/pəˈlaɪt/). A, B, C nhấn âm tiết 1.", q_tr: "Chọn từ có trọng âm khác các từ còn lại.", ans_tr: "Đáp án D: polite (lịch sự - nhấn âm 2)." },
            { id: 5, q: "Câu 5: Trọng âm tính từ 3 âm tiết", opts: [{ text: "A. confident", word: "confident" }, { text: "B. creative", word: "creative" }, { text: "C. talkative", word: "talkative" }, { text: "D. personal", word: "personal" }], ans: "B", exp: "B (creative) trọng âm nhấn âm tiết 2 (/kriˈeɪ.tɪv/). A, C, D nhấn âm tiết 1.", q_tr: "Chọn từ có trọng âm khác các từ còn lại.", ans_tr: "Đáp án B: creative (sáng tạo - nhấn âm 2)." }
        ];

        const allQuestions = [...part1Data, ...part2Data];

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-US'; u.rate = 0.85;
                window.speechSynthesis.speak(u);
            }
        }

        function renderPart(data, containerId) {
            const container = document.getElementById(containerId);
            data.forEach(item => {
                let optsHtml = '';
                item.opts.forEach(opt => {
                    const char = opt.text.charAt(0);
                    optsHtml += `
                        <div style="margin:6px 0; display:flex; align-items:center;">
                            <label style="cursor:pointer; margin-right:6px;"><input type="radio" name="q_${item.id}" value="${char}"> ${opt.text}</label>
                            <button type="button" class="btn-audio" onclick="speak('${opt.word}')">🔊 Nghe</button>
                        </div>`;
                });
                container.innerHTML += `
                    <div class="question-card" id="card_q_${item.id}">
                        <div style="font-weight:bold; color:#1565c0;">${item.q}</div>
                        <div>${optsHtml}</div>
                        <button type="button" class="btn-submit-q" onclick="checkQuestion(${item.id})">Nộp câu này</button>
                        <div id="explain_q_${item.id}" class="explanation"></div>
                    </div>`;
            });
        }

        function checkQuestion(qId) {
            const item = allQuestions.find(x => x.id === qId);
            if (!item) return;
            const card = document.getElementById(`card_q_${qId}`);
            const explainDiv = document.getElementById(`explain_q_${qId}`);
            explainDiv.style.display = 'block';

            const sel = document.querySelector(`input[name="q_${qId}"]:checked`);
            if (sel && sel.value === item.ans) {
                card.className = "question-card status-correct";
                explainDiv.className = "explanation correct";
                explainDiv.innerHTML = `<b>✓ CHÍNH XÁC!</b><br>📌 <b>Dịch câu hỏi:</b> ${item.q_tr}<br>💡 <b>Dịch đáp án chuẩn:</b> ${item.ans_tr}<br>📝 <b>Giải thích chi tiết:</b> ${item.exp}`;
            } else {
                card.className = "question-card status-wrong";
                explainDiv.className = "explanation wrong";
                explainDiv.innerHTML = `<b>✗ CHƯA CHÍNH XÁC!</b> (Đáp án chuẩn: <b>${item.ans}</b>)<br>📌 <b>Dịch câu hỏi:</b> ${item.q_tr}<br>💡 <b>Dịch đáp án chuẩn:</b> ${item.ans_tr}<br>📝 <b>Giải thích chi tiết:</b> ${item.exp}`;
            }
        }
        window.onload = function() { renderPart(part1Data, 'part1Quiz'); renderPart(part2Data, 'part2Quiz'); };
    </script>
</body>
</html>
